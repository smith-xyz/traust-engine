[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "traust-engine"
version = "0.39.4"
license = "Apache-2.0"
description = "Continuous-ops service for the AI security harness, on traust-core"
requires-python = ">=3.11"
dependencies = [
    "traust-core",
    "pyyaml",
]

[project.scripts]
traust-engine = "traust_engine.ops.cli:main"

[project.optional-dependencies]
signing = ["sigstore>=4.0,<5.0"]

[dependency-groups]
dev = ["pytest>=9.1.1", "pytest-xdist>=3", "ruff>=0.6", "vulture>=2.16"]

[tool.uv.sources]
traust-core = { git = "https://github.com/traust-security/traust-core.git", rev = "2bdc2d6d5435820a934c1094ae1901599710dfd0" }

[tool.hatch.build.targets.wheel]
packages = ["src/traust_engine"]

[tool.hatch.build.targets.sdist]
exclude = ["/.ci-venv", "/.venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests requiring external binaries (opengrep) on PATH",
    "requires_git: test creates git repos in tmp dirs (skipped when git init is blocked)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "PTH", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "E741", "E402", "E501", "RUF012"]
